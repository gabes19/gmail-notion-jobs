name: Apply approved Gmail proposals

on:
  workflow_dispatch:
    inputs:
      proposal_ids:
        description: Comma-separated proposal IDs from the review issue
        required: true
      days:
        description: Gmail lookback window in days
        required: false
        default: "14"
      max_results:
        description: Maximum Gmail messages to inspect
        required: false
        default: "100"
      dry_run:
        description: Print selected proposals without changing Notion
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install -e ".[dev]"
      - name: Apply selected proposals
        env:
          GOOGLE_OAUTH_CLIENT_JSON: ${{ secrets.GOOGLE_OAUTH_CLIENT_JSON }}
          GOOGLE_OAUTH_TOKEN_JSON: ${{ secrets.GOOGLE_OAUTH_TOKEN_JSON }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATA_SOURCE_ID: ${{ secrets.NOTION_DATA_SOURCE_ID }}
          NOTION_VERSION: ${{ vars.NOTION_VERSION || '2025-09-03' }}
          PROPOSAL_IDS: ${{ github.event.inputs.proposal_ids }}
          SCAN_DAYS: ${{ github.event.inputs.days }}
          SCAN_MAX_RESULTS: ${{ github.event.inputs.max_results }}
          DRY_RUN_FLAG: ${{ github.event.inputs.dry_run == 'true' && '--dry-run' || '' }}
        run: >
          gmail-notion-jobs apply
          --proposal-ids "$PROPOSAL_IDS"
          --days "${SCAN_DAYS:-14}"
          --max-results "${SCAN_MAX_RESULTS:-100}"
          $DRY_RUN_FLAG

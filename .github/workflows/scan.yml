name: Scan Gmail job updates

on:
  schedule:
    - cron: "0 13 * * *"
  workflow_dispatch:
    inputs:
      days:
        description: Gmail lookback window in days
        required: false
        default: "14"
      max_results:
        description: Maximum Gmail messages to inspect
        required: false
        default: "100"

permissions:
  contents: read
  issues: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run scan and update review issue
        env:
          GOOGLE_OAUTH_CLIENT_JSON: ${{ secrets.GOOGLE_OAUTH_CLIENT_JSON }}
          GOOGLE_OAUTH_TOKEN_JSON: ${{ secrets.GOOGLE_OAUTH_TOKEN_JSON }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATA_SOURCE_ID: ${{ secrets.NOTION_DATA_SOURCE_ID }}
          NOTION_VERSION: ${{ vars.NOTION_VERSION || '2025-09-03' }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          SCAN_DAYS: ${{ github.event.inputs.days }}
          SCAN_MAX_RESULTS: ${{ github.event.inputs.max_results }}
          PUBLISH_REVIEW_ISSUE: ${{ vars.PUBLISH_REVIEW_ISSUE }}
        shell: bash
        run: |
          issue_flag=""
          if [ "$PUBLISH_REVIEW_ISSUE" = "true" ]; then
            issue_flag="--write-issue"
          fi

          gmail-notion-jobs scan \
            --days "${SCAN_DAYS:-14}" \
            --max-results "${SCAN_MAX_RESULTS:-100}" \
            --json-output proposals.json \
            --markdown-output review.md \
            --quiet \
            $issue_flag
      - uses: actions/upload-artifact@v4
        if: ${{ vars.PUBLISH_REVIEW_ARTIFACT == 'true' }}
        with:
          name: gmail-notion-review
          path: |
            proposals.json
            review.md
